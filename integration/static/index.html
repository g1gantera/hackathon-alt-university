<!doctype html>
<html lang="ru">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/integration/assets/shell.css">
  <script type="module" src="/integration/assets/shell.js"></script>
</head>
<body>

    <nav aria-label="Разделы приложения">

    <span>Кокшетау ↔ Астана Нурлы Жол</span>

    <iframe id="dispatcher" title="Диспетчерская панель" src="/dispatcher/"></iframe>
    <iframe id="network" title="Карта железнодорожной сети и движение поездов" data-src="/network/" hidden></iframe>
  </main>

</html>
