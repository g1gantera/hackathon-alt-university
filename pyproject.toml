[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autodispatch-algorithms"
version = "0.1.0"
description = "Hackathon railway scheduling, advisory speed profiles and metrics"
requires-python = ">=3.11"
dependencies = ["ortools>=9.12,<10", "numpy>=2,<3", "pydantic>=2.10,<3", "simpy>=4,<5", "pandas>=2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
realism = ["scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.scripts]
autodispatch = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend", "vendor/railsim"]
include = ["app*", "railsim*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
