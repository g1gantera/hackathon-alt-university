name: Integrated application

on:
  push:
    branches: [integrated]
  pull_request:
    paths:
      - integration/**
      - frontend/**
      - backend/**
      - map.html
      - map_data.js
      - .github/workflows/integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      DISPATCH_ENGINE: logic
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install existing locked packages
        run: |
          python -m pip install -r backend/requirements.lock.txt -e .
          npx --yes pnpm@11.25.0 --dir frontend install --frozen-lockfile
      - name: Build integrated frontend
        run: npx --yes pnpm@11.25.0 --dir frontend build
      - name: Check algorithms, contracts and source preservation
        run: |
          python -m pytest backend/tests tests integration/tests -q
          node --test integration/tests/*.test.mjs
      - name: Check live shared simulation
        shell: bash
        run: |
          python -m uvicorn integration.main:app --host 127.0.0.1 --port 8000 > /tmp/railflow-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/integration > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/railflow-server.log; exit 1; fi
          python -m integration.smoke
