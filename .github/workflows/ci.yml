name: Tests and build

on:
  push:
    branches: [main, M_part]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Test simulator and parser
        run: python -m pytest backend/tests tests -q
      - name: Verify accelerated 24, 48 and 72 hour retention
        run: python scripts/verify_retention.py
      - name: Verify all four services and incident replanning
        run: python scripts/run_local.py --api-port 8012 --service-base 8111 --database .logs/ci-services.sqlite --verify

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          working-directory: frontend
          runtime: node@22
          require-lockfile: true
          cache: true
      - name: Test frontend state and contracts
        run: pnpm --dir frontend test
      - name: Type-check and build
        run: pnpm --dir frontend build
